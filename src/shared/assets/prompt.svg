<!-- Siri-like Animated Icon (pink glow) -->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI summon icon">
    <defs>
        <radialGradient id="g1" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
            <stop offset="30%" stop-color="#FFD2E8" stop-opacity="0.8"/>
            <stop offset="70%" stop-color="#FF9AC4" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#FF4FA3" stop-opacity="0.15"/>
        </radialGradient>

        <radialGradient id="g2" cx="50%" cy="55%" r="70%">
            <stop offset="0%" stop-color="#FFECF6" stop-opacity="0.9"/>
            <stop offset="40%" stop-color="#FFB0D8" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#FF4FA3" stop-opacity="0.12"/>
        </radialGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- background subtle glow -->
    <g filter="url(#glow)">
        <circle cx="64" cy="64" r="36" fill="url(#g2)" />
    </g>

    <!-- rotating petal shapes -->
    <g transform="translate(64,64)">
        <!-- petal A -->
        <g transform="rotate(0)">
            <path d="M0 -44 C18 -44, 34 -30, 34 -10 C34 12, 18 26, 0 26 C-18 26, -34 12, -34 -10 C-34 -30, -18 -44, 0 -44 Z"
                  fill="url(#g1)" opacity="0.95">
                <animateTransform attributeName="transform" type="rotate"
                                  from="0" to="360" dur="8s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.9;0.65;0.9" dur="4s" repeatCount="indefinite"/>
            </path>
        </g>

        <!-- petal B (offset, different speed & hue) -->
        <g transform="rotate(120)">
            <path d="M0 -34 C14 -34, 28 -24, 28 -8 C28 10, 14 20, 0 20 C-14 20, -28 10, -28 -8 C-28 -24, -14 -34, 0 -34 Z"
                  fill="#FF7BBE" opacity="0.88">
                <animateTransform attributeName="transform" type="rotate"
                                  from="120" to="-240" dur="12s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.85;0.55;0.85" dur="5.5s" repeatCount="indefinite"/>
            </path>
        </g>

        <!-- petal C (offset, scale pulse) -->
        <g transform="rotate(240)">
            <path d="M0 -30 C12 -30, 24 -20, 24 -6 C24 8, 12 18, 0 18 C-12 18, -24 8, -24 -6 C-24 -20, -12 -30, 0 -30 Z"
                  fill="#FF4FA3" opacity="0.92">
                <animateTransform attributeName="transform" type="rotate"
                                  from="240" to="600" dur="10s" repeatCount="indefinite"/>
                <animateTransform attributeName="transform" additive="sum" type="scale"
                                  from="0.96" to="1.06" dur="2.4s" repeatCount="indefinite"/>
            </path>
        </g>

        <!-- center core -->
        <circle cx="0" cy="0" r="10" fill="#FFFFFF" opacity="0.98">
            <animate attributeName="r" values="10;12;10" dur="1.8s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.98;0.7;0.98" dur="1.8s" repeatCount="indefinite"/>
        </circle>

        <!-- small sparkles -->
        <g>
            <circle cx="-28" cy="-6" r="2.2" fill="#FFF0FA" opacity="0.9">
                <animate attributeName="cy" values="-6;-10;-6" dur="2.6s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.9;0.25;0.9" dur="2.6s" repeatCount="indefinite"/>
            </circle>
            <circle cx="26" cy="8" r="1.6" fill="#FFE6F5" opacity="0.85">
                <animate attributeName="cx" values="26;30;26" dur="2.1s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.85;0.2;0.85" dur="2.1s" repeatCount="indefinite"/>
            </circle>
        </g>
    </g>
</svg>
